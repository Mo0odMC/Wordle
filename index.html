<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordle</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script defer src="./js/app.js"></script>
    <link rel="shortcut icon" href="./assets/favicon.png" type="image/x-icon" />
  </head>
  <body>
    <div class="game-container">
      <header>
        <div class="help-container">
          <button id="help">Help</button>
          <button id="dark">Dark Mode</button>
          <p id="timer"></p>
        </div>
        <div class="title">
          <h1>Guess the Word</h1>
          <p id="message">Guess the five-letter word!</p>
        </div>
        <div class="settings">
          <button id="hide-video">Hide Video</button>
          <button id="video">Change video</button>
          <button id="audio">Toggle audio</button>
        </div>
      </header>
      <main>
        <aside class="left-panel">
          <section class="instructions">
            <h2>Instructions</h2>
            <p>
              Type any 5 letter words to guess the word. if the box is yellow
              the letter is correct in the wrong place, if the box is green the
              letter is correct in the right place.
            </p>
          </section>
          <button id="reset">reset</button>
        </aside>
        <section class="game-board">
          <div class="row">
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
          </div>
          <div class="row">
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
          </div>
          <div class="row">
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
          </div>
          <div class="row">
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
          </div>
          <div class="row">
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
            <div class="tile"></div>
          </div>
        </section>
        <aside class="right-panel">
          <iframe
            id="player"
            autoplay="true"
            width="350"
            height="350"
            src="https://www.youtube.com/embed/B_5Gve6UIhg?autoplay=1&mute=1"
            title="Compilation PlayGame Subway Surfers 1 Hour GamePlay Subway Surf 2023 On PC Win 10 HD"
            frameborder="0"
            allow="autoplay"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
        </aside>
      </main>
      <section class="on-screen-keyboard">
        <div class="keyboard-row">
          <button>Q</button>
          <button>W</button>
          <button>E</button>
          <button>R</button>
          <button>T</button>
          <button>Y</button>
          <button>U</button>
          <button>I</button>
          <button>O</button>
          <button>P</button>
        </div>
        <div class="keyboard-row">
          <button>A</button>
          <button>S</button>
          <button>D</button>
          <button>F</button>
          <button>G</button>
          <button>H</button>
          <button>J</button>
          <button>K</button>
          <button>L</button>
          <button>Enter</button>
        </div>
        <div class="keyboard-row">
          <button>Z</button>
          <button>X</button>
          <button>C</button>
          <button>V</button>
          <button>B</button>
          <button>N</button>
          <button>M</button>
          <button>Backspace</button>
        </div>
      </section>
    </div>
    <dialog>add minecraft villager win condition</dialog>
    <footer><a href="./references.html" target="_blank">References</a></footer>
    <audio
      id="music"
      src="https://archive.org/download/soundcloud-177671751/Alan_Walker_-_Fade_NCS_Release-177671751.mp3"
      loop
      preload="auto"
    ></audio>
  </body>
</html>
